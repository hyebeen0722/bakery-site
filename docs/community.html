<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고객 커뮤니티 · 브레드 컴퍼스</title><link rel="stylesheet" href="style.css"><script src="community-config.js" defer></script><script src="community.js" defer></script></head>
<body><header class="top wrap"><a class="brand" href="index.html">Bread Compass<span>브레드 컴퍼스</span></a><nav aria-label="주 메뉴"><a href="index.html#menu">메뉴</a><a href="community.html" aria-current="page">커뮤니티</a><a href="index.html#visit">매장 안내</a></nav></header>
<main class="wrap section forum"><p class="eyebrow">THE BREAD CLUB</p><h1>고객 커뮤니티</h1><p>먹어 본 빵, 궁금한 메뉴, 다음에 만나고 싶은 빵 이야기를 나눠요.</p>
<p id="local-note" hidden>이 파일에서 작성한 글과 댓글은 이 브라우저에만 저장됩니다.</p><a class="write-shortcut button" href="#compose-title">글쓰기</a>
<div class="forum-layout"><section aria-labelledby="board-title"><div class="board-heading"><h2 id="board-title">게시판</h2><label for="filter">주제</label><select id="filter"><option value="">전체</option><option>매장 공지</option><option>먹어봤어요</option><option>궁금해요</option><option>이런 빵 어때요?</option></select></div><p id="status" role="status">게시글을 불러오는 중입니다.</p><div id="posts"></div><template id="comment-template"><form class="comment-form"><label>닉네임<input name="author" maxlength="24" required></label><label>댓글<textarea name="body" maxlength="400" rows="2" required></textarea></label><button class="button">댓글 등록</button><p role="status"></p></form></template></section>
<section class="composer" aria-labelledby="compose-title"><h2 id="compose-title">글쓰기</h2><form id="compose"><label>주제<select name="category" required><option>먹어봤어요</option><option>궁금해요</option><option>이런 빵 어때요?</option></select></label><label>닉네임<input name="author" maxlength="24" required></label><label>제목<input name="title" maxlength="80" required></label><label>내용<textarea name="body" maxlength="1500" rows="5" required></textarea></label><button class="button">게시글 등록</button><p id="compose-status" role="status"></p></form></section></div></main>
<footer class="wrap footer"><a href="index.html">Bread Compass</a><small>브레드 컴퍼스 고객 커뮤니티</small></footer></body></html>
